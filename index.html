<style>

.log{height:48vh;overflow:auto;background:var(--p);border:1px solid var(--b);border-radius:14px;padding:14px}.msg{margin:9px 0;padding:9px 13px;border-radius:13px;max-width:94%;background:var(--p2)}.msg.me{background:var(--g);color:#fff;margin-left:auto;width:fit-content}
.bar{display:flex;gap:8px;margin-top:10px}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.empty{padding:22px;text-align:center;color:var(--m);background:var(--p);border:1px dashed var(--b);border-radius:14px}
.cbox{height:250px;background:var(--p);border:1px solid var(--b);border-radius:14px;padding:12px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px 10px;border-bottom:1px solid var(--b)}.tw{overflow-x:auto}

@media(max-width:800px){.hero,.detail{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<header><div class="logo" data-go="#/">CineTune <i>AI</i></div><nav id="nav"></nav><button class="ghost" id="th" aria-label="Toggle theme">◐</button></header>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)};
/* ---------- sample catalogue (same data the backend seeds) ---------- */
const MP=[91,88,95,70,76,66,60,84,80,58,86,89,64,72];
const MOV=[["Inception",2010,"Action|Sci-Fi|Thriller","English","Leonardo DiCaprio, Joseph Gordon-Levitt","Christopher Nolan","A thief who steals secrets through dreams is offered one last job: planting an idea.",8.8],["Interstellar",2014,"Sci-Fi|Drama","English","Matthew McConaughey, Anne Hathaway","Christopher Nolan","Explorers travel through a wormhole to find a new home for humanity.",8.6],["The Dark Knight",2008,"Action|Thriller|Crime","English","Christian Bale, Heath Ledger","Christopher Nolan","Batman faces the Joker, who plunges Gotham into chaos.",9.0],["The Notebook",2004,"Romance|Drama","English","Ryan Gosling, Rachel McAdams","Nick Cassavetes","A poor young man and a rich young woman fall in love over one summer.",7.8],["La La Land",2016,"Romance|Musical|Comedy","English","Ryan Gosling, Emma Stone","Damien Chazelle","A jazz pianist and an aspiring actress chase their dreams in Los Angeles.",8.0],["The Conjuring",2013,"Horror|Thriller","English","Vera Farmiga, Patrick Wilson","James Wan","Paranormal investigators help a family terrorized by a dark presence.",7.5],["Superbad",2007,"Comedy","English","Jonah Hill, Michael Cera","Greg Mottola","Two friends try to enjoy one last wild night before graduation.",7.6],["3 Idiots",2009,"Comedy|Drama","Hindi","Aamir Khan, R. Madhavan","Rajkumar Hirani","Three engineering students navigate friendship and the pressure to succeed.",8.4],["Dangal",2016,"Drama|Sport","Hindi","Aamir Khan, Fatima Sana Shaikh","Nitesh Tiwari","A former wrestler trains his daughters to become world-class champions.",8.3],["Kabir Singh",2019,"Romance|Drama","Hindi","Shahid Kapoor, Kiara Advani","Sandeep Reddy Vanga","A brilliant but self-destructive surgeon spirals after heartbreak.",7.1],["Parasite",2019,"Thriller|Drama|Comedy","Korean","Song Kang-ho, Choi Woo-shik","Bong Joon-ho","A poor family schemes its way into the lives of a wealthy household.",8.5],["The Matrix",1999,"Action|Sci-Fi","English","Keanu Reeves, Laurence Fishburne","Lana Wachowski","A hacker discovers reality is a simulation and joins a rebellion.",8.7],["Get Out",2017,"Horror|Thriller","English","Daniel Kaluuya, Allison Williams","Jordan Peele","A young man uncovers a disturbing secret at his girlfriend’s family estate.",7.7],["Titanic",1997,"Romance|Drama","English","Leonardo DiCaprio, Kate Winslet","James Cameron","A romance blooms aboard the ill-fated ocean liner.",7.9]].map((a,i)=>({k:'movie',id:i+1,t:a[0],y:a[1],g:a[2].split('|'),l:a[3],c:a[4],d:a[5],o:a[6],r:a[7],p:MP[i]}));
const SP=[95,82,90,85,80,92,88,70,78,65,62,68,60,86];
const SNG=[["Tum Hi Ho","Arijit Singh","Aashiqui 2","Romantic|Bollywood","Hindi","romantic"],["Channa Mereya","Arijit Singh","Ae Dil Hai Mushkil","Romantic|Bollywood","Hindi","sad"],["Kesariya","Arijit Singh","Brahmastra","Romantic|Bollywood","Hindi","romantic"],["Shape of You","Ed Sheeran","Divide","Pop","English","upbeat"],["Perfect","Ed Sheeran","Divide","Pop|Romantic","English","romantic"],["Blinding Lights","The Weeknd","After Hours","Pop|Synth","English","upbeat"],["Bohemian Rhapsody","Queen","A Night at the Opera","Rock","English","epic"],["Hotel California","Eagles","Hotel California","Rock","English","mellow"],["Lose Yourself","Eminem","8 Mile","Hip-Hop","English","intense"],["Clair de Lune","Debussy","Suite bergamasque","Classical|Instrumental","Instrumental","relaxing study"],["Take Five","Dave Brubeck","Time Out","Jazz|Instrumental","Instrumental","relaxing study"],["Strobe","Deadmau5","For Lack of a Better Name","EDM","Instrumental","energetic"],["Weightless","Marconi Union","Weightless","Ambient|Instrumental","Instrumental","relaxing study"],["Levitating","Dua Lipa","Future Nostalgia","Pop|Dance","English","upbeat"]].map((a,i)=>({k:'song',id:i+1,t:a[0],a:a[1],al:a[2],g:a[3].split('|'),l:a[4],m:a[5],p:SP[i]}));
const CAT={movie:MOV,song:SNG},MG=['Action','Comedy','Horror','Romance','Thriller','Sci-Fi','Drama','Crime'],SG=['Pop','Rock','Classical','Hip-Hop','Jazz','EDM','Romantic','Bollywood'];
/* ---------- state (browser storage, guarded) ---------- */
let ST={name:'',mg:[],sg:[],names:'',ev:[],pl:[]};try{ST={...ST,...JSON.parse(localStorage.getItem('ct')||'{}')}}catch(e){}
const save=()=>{try{localStorage.setItem('ct',JSON.stringify(ST))}catch(e){}};
const val=e=>({like:5,dislike:1,fav:4.5,watch:4,play:3.5})[e.a]??(e.a=='rate'?e.v:null);
const RATED=['like','dislike','rate','fav'];
function act(k,i,a,v){let ev=ST.ev;if(a=='like'||a=='dislike')ev=ev.filter(e=>!(e.k==k&&e.i==i&&['like','dislike'].includes(e.a)));
if(a=='rate')ev=ev.filter(e=>!(e.k==k&&e.i==i&&e.a=='rate'));
if(a=='watch'||a=='fav'){const had=ev.some(e=>e.k==k&&e.i==i&&e.a==a);ev=ev.filter(e=>!(e.k==k&&e.i==i&&e.a==a));if(had){ST.ev=ev;save();return false}}
ev.push({k,i,a,v,ts:Date.now()});ST.ev=ev;save();return true}
/* ---------- recommender (browser port of backend/app/ml/engine.py) ---------- */
let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const DEMO=[];for(let u=1;u<=20;u++){for(const[k,n]of[['movie',14],['song',14]]){const s=new Set();while(s.size<6)s.add(1+Math.floor(rnd()*n));s.forEach(i=>DEMO.push({u,k,i,a:k=='movie'?'rate':'like',v:k=='movie'?(u%2?3+Math.floor(rnd()*3):1+Math.floor(rnd()*5)):5,ts:Date.now()-Math.floor(rnd()*13)*864e5}))}}
const doc=x=>x.k=='movie'?[x.g,x.g,x.d,x.c,x.l,x.o].join(' '):[x.g,x.g,x.a,x.a,x.al,x.m,x.l].join(' ');
function tfidf(D){const N=D.length,tf=D.map(x=>{const m={};(doc(x).toLowerCase().match(/[a-z0-9]+/g)||[]).forEach(w=>m[w]=(m[w]||0)+1);return m}),df={};tf.forEach(m=>Object.keys(m).forEach(w=>df[w]=(df[w]||0)+1));
const v=tf.map(m=>{const o={};let n=0;for(const w in m){o[w]=m[w]*(Math.log((1+N)/(1+df[w]))+1);n+=o[w]**2}n=Math.sqrt(n)||1;for(const w in o)o[w]/=n;return o});
return v.map(a=>v.map(b=>{let s=0;for(const w in a)if(b[w])s+=a[w]*b[w];return s}))}
const SC={movie:tfidf(MOV),song:tfidf(SNG)};
function cfm(k,evs){const U={};for(const e of evs){const v=val(e);if(e.k==k&&v!=null)(U[e.u||'me']??={})[e.i]=v-3}const n=CAT[k].length;
return CAT[k].map((_,a)=>CAT[k].map((_,b)=>{let s=0,x=0,y=0;for(const u in U){const p=U[u][a+1]||0,q=U[u][b+1]||0;s+=p*q;x+=p*p;y+=q*q}return x&&y?s/Math.sqrt(x*y):0}))}
const attrs=x=>[...x.g,...(x.k=='movie'?x.c.split(', ').concat(x.d,x.l):[x.a,x.l])].map(s=>s.toLowerCase());
function recs(k,n=8,o={}){const D=CAT[k],mine={},seen=new Set(),evs=o.ev??ST.ev;
evs.filter(e=>e.k==k).forEach(e=>{const v=val(e);if(v!=null)mine[e.i]=v;if(RATED.includes(e.a))seen.add(e.i)});
const want=o.want??new Set([...(k=='movie'?ST.mg:ST.sg),...ST.names.split(',').map(s=>s.trim()),'English'.repeat(0)].map(s=>s.toLowerCase()).filter(Boolean));
const w=D.map(x=>(mine[x.id]??3)-3),hist=Math.min(Object.keys(mine).length/8,1),CF=cfm(k,[...DEMO,...evs.map(e=>({...e,u:'me'}))]);
const agg=S=>S.map(r=>{let a=0,b=0;r.forEach((s,j)=>{a+=s*w[j];b+=s*Math.abs(w[j])});return b>1e-6?(a/b+2)/4:.5});
const c=agg(SC[k]),cf=agg(CF),liked=Object.keys(mine).filter(i=>mine[i]>3).map(Number),out=[];
D.forEach((x,r)=>{if(seen.has(x.id))return;const hit=[...new Set(attrs(x))].filter(a=>want.has(a)),pop=k=='song'?x.p/100:(x.p/100+x.r/10)/2;
const con={c:.4*hist*c[r],cf:.3*hist*cf[r],p:(.5-.3*hist)*Math.min(hit.length/2,1),pop:.2*pop};out.push({x,s:Object.values(con).reduce((a,b)=>a+b),con,hit})});
out.sort((a,b)=>b.s-a.s);return out.slice(0,n).map(({x,con,hit})=>{const top=Object.keys(con).sort((a,b)=>con[b]-con[a])[0];let why='Popular and highly rated right now';
if(top=='c'&&liked.length){const near=liked.reduce((a,b)=>SC[k][x.id-1][b-1]>SC[k][x.id-1][a-1]?b:a);why='Recommended because you liked '+D[near-1].t}
else if(top=='cf')why='Users with similar taste enjoyed this';else if(top=='p'&&hit.length)why='Recommended because you enjoy '+hit.slice(0,2).join(', ');return{...x,why}})}
function similar(k,id,n=6){const CF=cfm(k,[...DEMO,...ST.ev.map(e=>({...e,u:'me'}))]),r=id-1;return CAT[k].filter(x=>x.id!=id).map(x=>({...x,s:.7*SC[k][r][x.id-1]+.3*CF[r][x.id-1],why:'Similar to '+CAT[k][r].t})).sort((a,b)=>b.s-a.s).slice(0,n)}
function trending(k,n=8){const since=Date.now()-14*864e5,all=[...DEMO,...ST.ev];return[...CAT[k]].map(x=>({...x,s:x.p/100+.1*all.filter(e=>e.k==k&&e.i==x.id&&e.ts>since).length})).sort((a,b)=>b.s-a.s).slice(0,n)}
function chat(q){const msg=q.toLowerCase(),words=msg.match(/[a-z]+/g)||[],has=l=>words.some(w=>l.includes(w));
const k=has(['song','songs','music','track','tracks','singer','study','studying','relaxing'])&&!has(['movie','movies','film','films'])?'song':'movie';
const sim=msg.match(/(?:similar to|like)\s+(.+)/);if(sim){const name=sim[1].replace(/[.?! ]+$/,''),mv=MOV.find(x=>x.t.toLowerCase().includes(name)),sg=SNG.find(x=>x.t.toLowerCase().includes(name)||x.a.toLowerCase().includes(name)),p=(k=='movie'?mv:sg)||mv||sg;
if(p){const own=p.k=='song'?SNG.filter(x=>x.a==p.a&&x.id!=p.id).map(x=>({...x,why:'By '+x.a})):[];const all=[...own,...similar(p.k,p.id)];return{reply:'Here are '+p.k+'s similar to '+name+':',items:[...new Map(all.map(x=>[x.id,x])).values()].slice(0,8)}}}
const hit=x=>[...new Set([...x.g,x.l,...(x.m||'').split(' ')].map(s=>s.toLowerCase()))].filter(a=>a&&(new RegExp('\\b'+a.replace(/[-]/g,'\\-')+'\\b').test(msg)||words.some(w=>w.length>=4&&a.slice(0,5)==w.slice(0,5))));
const sc=CAT[k].map(x=>({x,h:hit(x)})).filter(r=>r.h.length),best=Math.max(0,...sc.map(r=>r.h.length));let pool=sc.length?sc.filter(r=>r.h.length==best):CAT[k].map(x=>({x,h:[]}));
const trend=/trend|popular/.test(msg);if(trend)pool.sort((a,b)=>b.x.p-a.x.p);else if(/rating|rated|best|top/.test(msg))pool.sort((a,b)=>(b.x.r||b.x.p)-(a.x.r||a.x.p));else{const rk=Object.fromEntries(recs(k,50).map((x,i)=>[x.id,50-i]));pool.sort((a,b)=>(rk[b.x.id]||0)-(rk[a.x.id]||0))}
return{reply:'Here are some '+k+'s I found:',items:pool.slice(0,8).map(({x,h})=>({...x,why:h.length?'Matches your request: '+h.join(', '):trend?'Trending now':'Picked for you'}))}}
/* ---------- UI helpers ---------- */
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const cover=x=>{const h=hue(x.t);return `<div class="cover" style="background:linear-gradient(135deg,hsl(${h},70%,46%),hsl(${(h+60)%360},70%,24%))">${esc(x.t.split(' ').slice(0,2).map(w=>w[0]).join(''))}</div>`};
const acts=x=>`<button data-a="like" data-k="${x.k}" data-i="${x.id}" title="Like">👍</button><button data-a="dislike" data-k="${x.k}" data-i="${x.id}" title="Dislike">👎</button><button data-a="${x.k=='movie'?'watch':'fav'}" data-k="${x.k}" data-i="${x.id}" title="${x.k=='movie'?'Add to watchlist':'Add to favourites'}">${x.k=='movie'?'🔖':'❤️'}</button>`;
const card=x=>`<div class="card" data-go="#/${x.k}/${x.id}"><div>${cover(x)}</div><div class="meta"><b>${esc(x.t)}</b><small>${x.k=='movie'?x.y+' · '+esc(x.g.slice(0,2).join(', ')):esc(x.a)+' · '+esc(x.g[0])}</small>${x.r?`<small>⭐ ${x.r}</small>`:''}${x.why?`<em>💡 ${esc(x.why)}</em>`:''}<div class="acts">${acts(x)}</div></div></div>`;
const row=(t,a,e='Nothing here yet. Like or rate a few titles to fill this in.')=>`<h3>${t}</h3>${a.length?`<div class="grid">${a.map(card).join('')}</div>`:`<div class="empty">${e}</div>`}`;
const byId=(k,ids)=>ids.map(i=>CAT[k][i-1]);const lastIds=(k,as,n=8)=>[...new Set(ST.ev.filter(e=>e.k==k&&as.includes(e.a)).reverse().map(e=>e.i))].slice(0,n);
const P={};let later=null;
P['']=()=>{later=()=>{const sel=new Set(['Sci-Fi']);const draw=()=>{$('#hc').innerHTML=MG.map(g=>`<span class="chip ${sel.has(g)?'on':''}" data-hg="${g}" tabindex="0" role="button">${g}</span>`).join('');const r=recs('movie',4,{ev:[],want:new Set([...sel].map(s=>s.toLowerCase()))});$('#hr').innerHTML=sel.size?`<div class="grid">${r.map(card).join('')}</div>`:'<div class="empty">Pick a genre to see recommendations.</div>'};
$('#hc').onclick=e=>{const g=e.target.dataset.hg;if(g){sel.has(g)?sel.delete(g):sel.add(g);draw()}};draw()};
return `<section class="hero"><div><h1>Movies and music that learn what you love.</h1><p>CineTune combines content similarity, collaborative filtering and popularity into one hybrid recommender, and tells you why every title was picked.</p><p><button data-go="#/start">Start the live demo</button> <button class="ghost" data-go="#/about">How it works</button></p></div>
<div class="demo"><b>Try the cold-start recommender</b><p class="mu" style="margin:4px 0;font-size:14px">A brand-new user picks genres. No history yet.</p><div class="chips" id="hc"></div><div id="hr"></div></div></section>
<div class="cols"><div class="panel"><b>Hybrid recommendations</b><p class="mu">TF-IDF cosine similarity, item-based collaborative filtering and popularity blended by how much history you have.</p></div><div class="panel"><b>Explainable by design</b><p class="mu">Each card says why it appeared, from a liked title, similar users, or your stated interests.</p></div><div class="panel"><b>Learns from every click</b><p class="mu">Likes, ratings, watchlist and favourites update your recommendations instantly.</p></div><div class="panel"><b>Ask the assistant</b><p class="mu">“Suggest relaxing songs for studying” works against the catalogue.</p></div></div>`};
P.start=()=>{later=()=>{$('#sf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);ST.name=f.get('name').trim()||'Guest';ST.mg=f.getAll('mg');ST.sg=f.getAll('sg');ST.names=f.get('names');save();toast('Preferences saved');location.hash='#/dash'}};

const pl=k=='song'?`<select id="pls" style="max-width:260px"><option value="">+ Add to playlist</option>${ST.pl.map(p=>`<option>${esc(p.n)}</option>`).join('')}</select>`:'';
return `<div class="detail"><div>${cover(x)}</div><div><h1 style="font-size:38px">${esc(x.t)}</h1>${info}<div>${[1,2,3,4,5].map(n=>`<button class="star ${mine>=n?'on':''}" data-rate="${n}" aria-label="${n} stars">★</button>`).join('')}</div><div class="acts" style="margin:10px 0">${acts(x)}</div>${pl}</div></div>${row('Similar '+k+'s',similar(k,x.id))}`};

P.admin=()=>{const all=[...DEMO,...ST.ev],day=864e5,now=Date.now(),days=[...Array(14)].map((_,i)=>{const d=new Date(now-(13-i)*day);return d.toISOString().slice(5,10)}),act14=days.map(d=>all.filter(e=>new Date(e.ts).toISOString().slice(5,10)==d).length);

P.about=()=>`<h1 style="font-size:38px">How CineTune AI works</h1><p class="mu" style="max-width:62ch">This page runs the recommender in your browser on sample data. The downloadable project runs the same logic on a FastAPI backend with a SQLite database.</p>
<div class="flow"><div>React-style web app</div>→<div>FastAPI REST API (JWT auth)</div>→<div>Hybrid ML engine</div>→<div>SQLite database</div></div>
<h2>The hybrid score</h2><pre>score = 0.4 · history · content   (TF-IDF cosine similarity to items you liked)
      + 0.3 · history · collab    (item-item cosine on user ratings)
      + (0.5 − 0.3 · history) · interests  (genres, artists, actors you chose)
      + 0.2 · popularity          (rating and trending score)

history = min(ratings / 8, 1)   →   new users lean on interests and popularity (cold start)</pre>
<div class="cols"><div class="panel"><b>Backend</b><p class="mu">Registration and login with bcrypt and JWT, profiles, interests, movie and song search with filters, ratings, watchlist, playlists, rule-based chatbot, admin analytics.</p></div><div class="panel"><b>Data</b><p class="mu">Users, preferences, movies, songs, interactions, playlists and search logs. One interaction table feeds both the models and the admin charts.</p></div><div class="panel"><b>Integrations</b><p class="mu">TMDB for posters and Spotify for covers and previews are configured through <code>.env</code>. Audio is never bundled.</p></div></div>

  app/main.py · config.py · database.py · models.py · schemas.py · security.py
  app/routers/  auth · users · api (movies, songs, interact, chat) · admin
  app/ml/engine.py        content + collaborative + popularity + hybrid
  scripts/seed_db.py      sample catalogue, admin and 20 demo users
  static/index.html       web interface served at /</pre>
<h2>Run it locally</h2><pre>cd backend
pip install -r requirements.txt
cp .env.example .env
uvicorn app.main:app --reload     # open http://localhost:8000
# admin@cinetune.ai / Admin1234</pre>`;
